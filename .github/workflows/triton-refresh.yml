name: Refresh Triton dashboard

on:
  schedule:
    # 08:00, 13:00, 18:00 and 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 0,5,10,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore UBS data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            web/data
            data/repositories.json
            data/repos
            data/snapshot.json
          key: pages-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pages-data-${{ runner.os }}-

      - name: Ensure UBS data (确保 UBS 数据)
        env:
          SITE_FALLBACK_URL: https://tianli-backkom.github.io/ubs_core_monitor
        run: |
          set -euo pipefail

          fallback="${SITE_FALLBACK_URL:-https://tianli-backkom.github.io/ubs_core_monitor}"
          echo "[ensure-UBS-data] fallback site: $fallback"

          fetch() {
            local target="$1" remote_path="$2"
            echo "[ensure-UBS-data] $target is missing; downloading $fallback$remote_path"
            mkdir -p "$(dirname "$target")"
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$target" "$fallback$remote_path"; then
              echo "[ensure-UBS-data] restored $target"
            else
              echo "::warning::[ensure-UBS-data] download failed: $fallback$remote_path"
              rm -f "$target"
              return 1
            fi
          }

          # Multi-repo index: the dashboard entry point for all UBS views.
          if [ -s web/data/repositories.json ]; then
            echo "[ensure-UBS-data] web/data/repositories.json already present"
          else
            fetch web/data/repositories.json /data/repositories.json || true
          fi

          # Repo-root snapshot: tests/frontend.test.cjs requires data/snapshot.json.
          if [ -s data/snapshot.json ]; then
            echo "[ensure-UBS-data] data/snapshot.json already present"
          else
            fetch data/snapshot.json /data/snapshot.json || true
          fi

          # Per-repo snapshots, enumerated from the restored index.
          if [ -s web/data/repositories.json ]; then
            repo_names="$(python <<'PY'
          import json
          import sys

          try:
              with open("web/data/repositories.json", encoding="utf-8") as handle:
                  index = json.load(handle)
          except (OSError, ValueError) as error:
              print(f"[ensure-UBS-data] cannot enumerate repositories: {error}", file=sys.stderr)
              sys.exit(0)
          for entry in index.get("repositories", []):
              if isinstance(entry, dict) and entry.get("name"):
                  print(entry["name"])
          PY
          )"
            for name in $repo_names; do
              target="web/data/repos/$name.json"
              if [ -s "$target" ]; then
                echo "[ensure-UBS-data] $target already present"
              else
                fetch "$target" "/data/repos/$name.json" || true
              fi
            done
          else
            echo "[ensure-UBS-data] no index available; skipping per-repo snapshot checks"
          fi

          # No-deploy guard: without the index the UBS views cannot render at all.
          if [ ! -s web/data/repositories.json ]; then
            echo "::error::[ensure-UBS-data] web/data/repositories.json is still missing after fallback; refusing to deploy"
            exit 1
          fi
          echo "[ensure-UBS-data] UBS index verified; UBS data ensured"

      - name: Collect Triton gate data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 -m triton.dashboard --hours 72

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run Node tests
        run: node --test tests/*.test.cjs

      - name: Save UBS data cache
        uses: actions/cache/save@v4
        with:
          path: |
            web/data
            data/repositories.json
            data/repos
            data/snapshot.json
          key: pages-data-${{ runner.os }}-${{ github.run_id }}

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
