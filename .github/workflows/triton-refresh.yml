name: Refresh Triton dashboard

on:
  schedule:
    # 08:00, 13:00, 18:00 and 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 0,5,10,12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore shared UBS snapshot cache
        uses: actions/cache/restore@v4
        with:
          path: |
            web/data/repositories.json
            web/data/repos
            web/data/snapshot.json
            web/data/ubs-manifest.json
            data/repositories.json
            data/repos
            data/snapshot.json
          key: ubs-snapshots-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ubs-snapshots-v1-${{ runner.os }}-

      - name: Ensure UBS data (确保 UBS 数据)
        env:
          SITE_FALLBACK_URL: https://tianli-backkom.github.io/ubs_core_monitor
        run: |
          set -euo pipefail

          fallback="${SITE_FALLBACK_URL:-https://tianli-backkom.github.io/ubs_core_monitor}"
          echo "[ensure-UBS-data] fallback site: $fallback"

          fetch() {
            local target="$1" remote_path="$2"
            echo "[ensure-UBS-data] $target is missing; downloading $fallback$remote_path"
            mkdir -p "$(dirname "$target")"
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o "$target" "$fallback$remote_path"; then
              echo "[ensure-UBS-data] restored $target"
            else
              echo "::warning::[ensure-UBS-data] download failed: $fallback$remote_path"
              rm -f "$target"
              return 1
            fi
          }

          cache_count=0
          fallback_count=0
          mirror_count=0
          missing=""

          # Multi-repo index: the dashboard entry point for all UBS views.
          if [ -s web/data/repositories.json ]; then
            echo "[ensure-UBS-data] web/data/repositories.json already present (cache hit)"
            cache_count=$((cache_count+1))
          else
            fetch web/data/repositories.json /data/repositories.json && fallback_count=$((fallback_count+1)) || missing="$missing web/data/repositories.json"
          fi

          # ubs-engine compat snapshot, published copy (keeps /data/snapshot.json on the site).
          if [ -s web/data/snapshot.json ]; then
            echo "[ensure-UBS-data] web/data/snapshot.json already present (cache hit)"
            cache_count=$((cache_count+1))
          else
            fetch web/data/snapshot.json /data/snapshot.json && fallback_count=$((fallback_count+1)) || missing="$missing web/data/snapshot.json"
          fi

          # Shared bundle manifest: binds index and snapshots to one artifact version.
          if [ -s web/data/ubs-manifest.json ]; then
            echo "[ensure-UBS-data] web/data/ubs-manifest.json already present (cache hit)"
          else
            fetch web/data/ubs-manifest.json /data/ubs-manifest.json || echo "[ensure-UBS-data] no manifest on the fallback site yet (first run); validate_bundle.py will stamp one"
          fi

          # Repo-root snapshot: tests/frontend.test.cjs requires data/snapshot.json.
          if [ -s data/snapshot.json ]; then
            echo "[ensure-UBS-data] data/snapshot.json already present (cache hit)"
          elif [ -s web/data/snapshot.json ]; then
            mkdir -p data
            cp web/data/snapshot.json data/snapshot.json
            mirror_count=$((mirror_count+1))
            echo "[ensure-UBS-data] data/snapshot.json mirrored from web/data/snapshot.json"
          else
            fetch data/snapshot.json /data/snapshot.json && fallback_count=$((fallback_count+1)) || missing="$missing data/snapshot.json"
          fi

          # Per-repo snapshots, enumerated from the restored index.
          if [ -s web/data/repositories.json ]; then
            repo_names="$(python <<'PY'
          import json
          import sys

          try:
              with open("web/data/repositories.json", encoding="utf-8") as handle:
                  index = json.load(handle)
          except (OSError, ValueError) as error:
              print(f"[ensure-UBS-data] cannot enumerate repositories: {error}", file=sys.stderr)
              sys.exit(0)
          for entry in index.get("repositories", []):
              if isinstance(entry, dict) and entry.get("name"):
                  print(entry["name"])
          PY
          )"
            for name in $repo_names; do
              target="web/data/repos/$name.json"
              if [ -s "$target" ]; then
                echo "[ensure-UBS-data] $target already present (cache hit)"
                cache_count=$((cache_count+1))
              else
                fetch "$target" "/data/repos/$name.json" && fallback_count=$((fallback_count+1)) || missing="$missing $target"
              fi
              if [ ! -s "data/repos/$name.json" ] && [ -s "web/data/repos/$name.json" ]; then
                mkdir -p data/repos
                cp "web/data/repos/$name.json" "data/repos/$name.json"
                mirror_count=$((mirror_count+1))
                echo "[ensure-UBS-data] data/repos/$name.json mirrored from web/data/repos/$name.json"
              fi
            done
          else
            echo "[ensure-UBS-data] no index available; skipping per-repo snapshot checks"
          fi

          # Repo-root index mirror: keeps the shared cache path set complete.
          if [ ! -s data/repositories.json ] && [ -s web/data/repositories.json ]; then
            mkdir -p data
            cp web/data/repositories.json data/repositories.json
            mirror_count=$((mirror_count+1))
            echo "[ensure-UBS-data] data/repositories.json mirrored from web/data/repositories.json"
          fi

          # No-deploy guard: without the index the UBS views cannot render at all.
          if [ ! -s web/data/repositories.json ]; then
            echo "::error::[ensure-UBS-data] web/data/repositories.json is still missing after fallback; refusing to deploy"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::[ensure-UBS-data] still missing after fallback:$missing"
            echo "[ensure-UBS-data] summary: cache=$cache_count fallback=$fallback_count mirrored=$mirror_count missing=$(echo $missing | wc -w); NOT complete — bundle verification will block this deploy"
          else
            echo "[ensure-UBS-data] summary: cache=$cache_count fallback=$fallback_count mirrored=$mirror_count missing=0"
            echo "[ensure-UBS-data] UBS index verified; UBS data ensured (sources logged above; bundle fingerprint checked by validate_bundle.py)"
          fi

      - name: Collect Triton gate data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -X utf8 -m triton.dashboard --hours 72

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run Node tests
        run: node --test tests/*.test.cjs

      - name: Verify UBS snapshot bundle
        run: python -X utf8 validate_bundle.py --ensure-manifest

      - name: Save shared UBS snapshot cache
        uses: actions/cache/save@v4
        with:
          path: |
            web/data/repositories.json
            web/data/repos
            web/data/snapshot.json
            web/data/ubs-manifest.json
            data/repositories.json
            data/repos
            data/snapshot.json
          key: ubs-snapshots-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Upload deployment manifests
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifests
          path: |
            web/data/triton-manifest.json
            web/data/ubs-manifest.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download deployment manifests
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifests
          path: web/data

      - name: Verify published data (REQ-022)
        run: python -X utf8 -m triton.verify_deployment "${{ needs.deploy.outputs.page_url }}"
